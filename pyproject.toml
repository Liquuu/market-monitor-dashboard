[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "market-monitor-dashboard"
version = "0.1.0"
description = "Fetch and calculate market indicators for a GitHub Pages dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.2",
  "pandas==3.0.5",
  "PyYAML==6.0.3",
  "yfinance==1.6.0",
]

[project.scripts]
market-monitor = "market_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

